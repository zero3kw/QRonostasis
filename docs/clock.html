<!DOCTYPE html>
<html lang="en">
<!-- QRonostasis clock for an OBS browser source. Shows the Unix time in seconds
     as a QR code and switches it on the second. The code holds the URL
     HTTPS://ZERO3KW.GITHUB.IO/QRonostasis/<seconds>/<beacon digits>: the
     scheme and host in capitals (alphanumeric mode), the repository path as is
     (byte mode; GitHub Pages matches it case-sensitively) and the seconds
     (numeric mode), then "/" and 20 digits of the drand beacon (beacon.js),
     33x33 modules. The beacon shows the code was made after its round; while
     drand cannot be reached, no code is shown. Opened in a
     browser, the URL lands on 404.html, which shows and checks the time.
     Outside OBS (no window.obsstudio) the page is black instead of transparent.
     Dots with circular finder patterns and the logo in the center 5x5 modules
     (error correction M recovers them) on a rounded plate; the rest is transparent.
     Colors: ?fg=RRGGBB&bg=RRGGBB (hex without #). Defaults to white on the app icon's dark gray. -->
<head>
  <meta charset="UTF-8">
  <title>QRonostasis Clock</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas { display: block; }
  </style>
  <script src="/QRonostasis/analytics.js"></script>
</head>
<body>
  <canvas></canvas>
  <script src="qrcode.min.js"></script>
  <script type="module">
    import { now, start } from "./time.js";
    import { digitsFor, start as startBeacon } from "./beacon.js";

    const params = new URLSearchParams(location.search);
    const color = (key, fallback) => {
      const v = params.get(key);
      return v && /^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v) ? "#" + v : fallback;
    };
    const FG = color("fg", "#fff"), BG = color("bg", "#101114");
    const HOST = "HTTPS://ZERO3KW.GITHUB.IO/", PATH = "QRonostasis/";
    const QUIET = 2;  // quiet zone in modules

    if (!window.obsstudio) document.documentElement.style.background = "#000";

    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    let shown = 0;

    function fill(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    // The canvas matches the source in device pixels and every module edge is
    // snapped to a whole pixel, so a small source stays sharp instead of being
    // resampled (modules may alternate between, say, 1 and 2 px). Below 3 px
    // per module a dot cannot be drawn round, so modules become squares there.
    function draw(sec) {
      const digits = digitsFor(sec);
      if (!digits) { canvas.width = 0; return; }
      const q = qrcode(0, "M");
      q.addData(HOST, "Alphanumeric");
      q.addData(PATH, "Byte");
      q.addData(String(sec), "Numeric");
      q.addData("/", "Alphanumeric");
      q.addData(digits, "Numeric");
      q.make();
      const n = q.getModuleCount(), total = n + QUIET * 2, dpr = devicePixelRatio || 1;
      const size = Math.floor(Math.min(innerWidth, innerHeight) * dpr);
      const edge = (m) => Math.round((m + QUIET) * size / total);  // pixel edge of module m
      const span = (m, k = 1) => edge(m + k) - edge(m);
      const inFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
      const L = (n - 5) / 2, inLogo = (r, c) => r >= L && r < L + 5 && c >= L && c < L + 5;
      const round = size / total >= 3, rad = round ? size / total : 0;

      canvas.width = canvas.height = size;
      canvas.style.width = canvas.style.height = `${size / dpr}px`;
      ctx.fillStyle = BG;
      fill(0, 0, size, size, rad);

      // Finder patterns as concentric circles (ring, gap, core in 1:1:3:1:1).
      // Nothing may cross the white ring, or readers stop finding them.
      for (const [r, c] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
        const x = edge(c) + span(c, 7) / 2, y = edge(r) + span(r, 7) / 2, R = span(c, 7) / 2;
        for (const [k, color] of [[1, FG], [5 / 7, BG], [3 / 7, FG]]) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x, y, R * k, 0, 2 * Math.PI);
          ctx.fill();
        }
      }

      ctx.fillStyle = FG;
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++) {
          if (!q.isDark(r, c) || inFinder(r, c) || inLogo(r, c)) continue;
          if (!round) { ctx.fillRect(edge(c), edge(r), span(c), span(r)); continue; }
          ctx.beginPath();
          ctx.arc(edge(c) + span(c) / 2, edge(r) + span(r) / 2, 0.45 * Math.min(span(c), span(r)), 0, 2 * Math.PI);
          ctx.fill();
        }

      logo(edge(L) + span(L, 5) / 2, edge(L) + span(L, 5) / 2, span(L, 5) * 3.8 / 5);
    }

    // The logo: a dial of dots with the hand at 4 o'clock, which also reads as
    // the tail of a Q. Drawn in a box of side s centered on (x, y).
    function logo(x, y, s) {
      const at = (hour, r) => [x + Math.sin(hour * Math.PI / 6) * r * s, y - Math.cos(hour * Math.PI / 6) * r * s];
      const dot = ([px, py], r) => { ctx.beginPath(); ctx.arc(px, py, r * s, 0, 2 * Math.PI); ctx.fill(); };
      for (let h = 0; h < 12; h++) if (h !== 4) dot(at(h, 0.36), 0.06);
      dot([x, y], 0.09);
      ctx.strokeStyle = FG; ctx.lineWidth = 0.09 * s; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(...at(4, 0.5)); ctx.stroke();
    }

    addEventListener("resize", () => { shown = 0; });

    function tick() {
      const sec = Math.floor(now() / 1000);
      if (sec !== shown) { draw(sec); shown = sec; }
      requestAnimationFrame(tick);
    }

    start();
    startBeacon();
    tick();
  </script>
</body>
</html>
