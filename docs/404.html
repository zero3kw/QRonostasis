<!DOCTYPE html>
<html lang="ja">
<!-- GitHub Pages serves this for any unknown path. A QRonostasis code opens
     /QRonostasis/<Unix seconds>/<beacon digits>; this page shows that moment
     and checks the digits against drand (beacon.js). Other paths get a link home. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRonostasis</title>
  <style>
    html { background: #000; }
    body {
      margin: 0 auto; max-width: 40em; padding: 3em 1.25em 4em;
      color: #c8c8c8; font: 16px/1.8 -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    h1 { font-weight: normal; letter-spacing: 0.15em; color: #eee; font-size: 1.1em; margin: 0 0 2em; }
    .time { font: 2.2em/1.3 ui-monospace, Menlo, monospace; color: #eee; font-variant-numeric: tabular-nums; }
    .sub { color: #888; font: 0.95em/1.8 ui-monospace, Menlo, monospace; }
    a { color: #eee; }
    p { margin: 0.5em 0; }
  </style>
  <script src="/QRonostasis/analytics.js"></script>
</head>
<body>
  <h1><a href="/QRonostasis/">QRonostasis</a></h1>
  <div id="out"></div>
  <script type="module">
    import { roundTime, verify } from "/QRonostasis/beacon.js";
    const m = location.pathname.match(/^\/QRonostasis\/(\d{10})\/(\d{20})\/?$/);
    const out = document.getElementById("out");
    const fmt = (sec, opts = {}) => new Intl.DateTimeFormat("ja-JP", { dateStyle: "long", timeStyle: "medium", ...opts }).format(sec * 1000);
    if (m) {
      const sec = Number(m[1]), digits = m[2];
      const ago = Math.round(Date.now() / 1000 - sec);
      out.innerHTML = `
        <p>この QR コードの表示時刻</p>
        <div class="time">${fmt(sec)}</div>
        <p class="sub">UTC ${fmt(sec, { timeZone: "UTC" })}<br>Unix ${sec}</p>
        <p class="sub">${ago >= 0 ? `${ago.toLocaleString()} 秒前` : `${(-ago).toLocaleString()} 秒後`}</p>
        <p id="check" class="sub"></p>
        <p><a href="/QRonostasis/">QRonostasis について</a></p>`;
      const round = await verify(sec, digits);
      if (round) document.getElementById("check").textContent = `検証済み：${fmt(roundTime(round))} 以降に生成`;
    } else {
      out.innerHTML = `<p>該当ページなし。</p><p><a href="/QRonostasis/">QRonostasis トップページ</a></p>`;
    }
  </script>
</body>
</html>
